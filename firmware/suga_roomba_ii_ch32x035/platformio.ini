; =============================================================================
; 菅ルンバ II Rev 3.0 (CH32X035G8U6 48MHz RISC-V, 2,410 JPY BOM)
; Native USB-ISP Upload via wchisp — ZERO External Debugger (WCH-LinkE) Needed!
; Hold BOOT button (or pull PB12->VDD) while plugging salvaged Daiso USB cable.
; =============================================================================
[env:ch32x035g8u6]
platform = ch32v
board = genericCH32X035G8U6
framework = arduino
upload_protocol = isp
monitor_speed = 115200
build_flags =
    -DCH32X035
    -DSUGA_ROOMBA_REV=3
    -O2
    -Wall
