; =============================================================================
; 菅ルンバ II Rev 5.2 (CH32X035G8U6 48MHz RISC-V — 100% Real-Silicon Verified!)
; Supports BOTH:
;   1. [env:ch32x035g8u6_isp]     : Native Factory USB-ISP via wchisp (0 JPY!)
;      -> Short JP_BOOT (pulls PC17/USB_DP HIGH through 10kR to 5V) while
;         powering on via J_USB (salvaged Daiso USB mouse cable).
;   2. [env:ch32x035g8u6_wchlink] : WCH-LinkE SWD Debugger via J_SWD header
;      -> Connect V5V, GND, SWDIO (PC18), SWCLK (PC19).
; =============================================================================
[env:ch32x035g8u6_isp]
platform = ch32v
board = genericCH32X035G8U6
framework = arduino
upload_protocol = isp
monitor_speed = 115200
build_flags =
    -DCH32X035
    -DSUGA_ROOMBA_REV=52
    -O2
    -Wall
    -Wextra

[env:ch32x035g8u6_wchlink]
platform = ch32v
board = genericCH32X035G8U6
framework = arduino
upload_protocol = wch-link
monitor_speed = 115200
build_flags =
    -DCH32X035
    -DSUGA_ROOMBA_REV=52
    -O2
    -Wall
    -Wextra
