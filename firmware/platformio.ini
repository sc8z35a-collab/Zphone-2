; PlatformIO Project Configuration File — 菅ルンバ II (Suga Roomba II)
; Target MCU: Akizuki Denshi AE-RP2040 [117542] (700 JPY)

[env:ae_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
build_flags =
    -O3
    -DSUGA_ROOMBA_II_REV2
    -DPICO_CORE1_STACK_SIZE=4096
src_dir = suga_roomba_ii_rp2040
